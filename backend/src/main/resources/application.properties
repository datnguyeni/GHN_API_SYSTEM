server.port=${PORT:8080}
server.address=${HOST:127.0.0.1}
server.shutdown=graceful
server.tomcat.connection-timeout=10s
spring.lifecycle.timeout-per-shutdown-phase=40s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=35s
spring.jackson.deserialization.fail-on-trailing-tokens=true
shipping.config-file=${GHN_CONFIG_FILE:config/service.json}
shipping.db-path=${GHN_DB_PATH:data/shipping.sqlite}
shipping.mode=${GHN_MODE:live}
shipping.static-dir=${GHN_STATIC_DIR:out}
